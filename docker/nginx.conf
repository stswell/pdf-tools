# nginx inside the PDF tools container (port 8080).
# Sign-in and group checks happen in front of this, on the Toolbox's nginx.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Health check for Docker, the Toolbox and Uptime Kuma
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
        # File names aren't versioned, so make browsers check for updates each time
        # (still fast: unchanged files come back as "304 Not Modified").
        add_header Cache-Control "no-cache" always;
    }

    # Never serve hidden files
    location ~ /\. { deny all; }
}
